# secrets.example.toml - template for secrets.toml (docs/API.md section 8).
#
# Copy to secrets.toml (which is gitignored, never commit it) and put a
# fresh random key in it:
#
#     python3 -c "import secrets; print(secrets.token_hex(32))"
#
# The same key goes into the client (home automation integration, sbctl).
# Changing it means rebuilding and reflashing the bridge.

[auth]
key = "REPLACE_WITH_64_HEX_DIGITS"
